name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-extras
      - name: Verify tag matches package version
        run: test "v$(uv run python -c 'import memory_loom; print(memory_loom.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv run pytest
      - run: uv run memory-loom validate-all
      - name: Enforce retrieval safety and quality gates
        run: >-
          uv run memory-loom evaluate-retrieval fixtures/scenarios/v1
          --output evaluation-runs/retrieval-fixtures.json
          --min-recall-at-k 1
          --min-mrr 1
          --max-no-memory-fpr 0
      - name: Build and smoke-test distributions
        run: ./scripts/check-release.sh dist
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --generate-notes
          --prerelease
          --title "$GITHUB_REF_NAME"
