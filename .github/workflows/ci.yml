name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --locked --all-extras
      - run: uv run pytest
      - run: uv run memory-loom validate-all
      - name: Enforce retrieval safety and quality gates
        run: >-
          uv run memory-loom evaluate-retrieval fixtures/scenarios/v1
          --output evaluation-runs/retrieval-fixtures.json
          --min-recall-at-k 1
          --min-mrr 1
          --max-no-memory-fpr 0
      - name: Build and smoke-test distributions
        run: ./scripts/check-release.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: memory-loom-distributions
          path: dist/
