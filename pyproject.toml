[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memory-loom"
version = "0.1.0"
description = "Experiment contracts and reference implementation for Memory Loom"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
dependencies = [
  "mcp[cli]>=2.2.0",
  "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/algeor/memory-loom"
Repository = "https://github.com/algeor/memory-loom"
Issues = "https://github.com/algeor/memory-loom/issues"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
memory-loom = "memory_loom.cli:main"
memory-loom-mcp = "memory_loom.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_loom"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
