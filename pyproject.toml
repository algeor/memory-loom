[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "memory-loom"
version = "0.1.0"
description = "Experiment contracts and reference implementation for Memory Loom"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
memory-loom = "memory_loom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_loom"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
