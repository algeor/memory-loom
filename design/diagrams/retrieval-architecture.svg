<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Memory Loom Retrieval Architecture</title>
  <desc id="desc">Diagram showing scoped retrieval through eligibility filters, FTS5 lexical search, reranking, context budget selection, provenance, and retrieval trace.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f4858" />
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2933" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #18212f; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 20px; fill: #526070; }
      .lane { fill: #ffffff; stroke: #d7dde7; stroke-width: 2; rx: 24; filter: url(#softShadow); }
      .box { fill: #ffffff; stroke: #b9c4d4; stroke-width: 2; rx: 18; filter: url(#softShadow); }
      .box-blue { fill: #eaf3ff; stroke: #6aa3df; }
      .box-green { fill: #eaf7f0; stroke: #64ad7f; }
      .box-orange { fill: #fff1e4; stroke: #e59a4c; }
      .box-purple { fill: #f0edff; stroke: #9278d6; }
      .box-red { fill: #fff0f1; stroke: #d86f78; }
      .trace { fill: #eef4f8; stroke: #6c8798; stroke-width: 2; rx: 20; filter: url(#softShadow); }
      .label { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #17202a; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 17px; fill: #465566; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 15px; fill: #526070; }
      .arrow { stroke: #2f4858; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #7a8898; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7a8898; stroke-width: 2.5; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .pill { fill: #17202a; rx: 16; }
      .pillText { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <text class="title" x="80" y="82">Retrieval Architecture</text>
  <text class="subtitle" x="80" y="118">Scoped memory retrieval: policy filters before ranking, reranking before context, trace for audit.</text>

  <rect class="lane" x="64" y="160" width="1472" height="465"/>
  <text class="small" x="92" y="201">Read path</text>

  <rect class="box box-blue" x="100" y="255" width="185" height="125"/>
  <text class="label" x="130" y="300">Request</text>
  <text class="small" x="130" y="332">current user</text>
  <text class="small" x="130" y="356">message</text>

  <rect class="box" x="330" y="255" width="190" height="125"/>
  <text class="label" x="360" y="300">Retrieve</text>
  <text class="small" x="360" y="332">MCP or JSON</text>
  <text class="small" x="360" y="356">stdio call</text>

  <rect class="box box-purple" x="330" y="430" width="190" height="90"/>
  <text class="label" x="360" y="466">Scope</text>
  <text class="small" x="360" y="493">user/project/task</text>

  <rect class="box box-orange" x="575" y="255" width="210" height="125"/>
  <text class="label" x="605" y="300">Policy</text>
  <text class="small" x="605" y="332">scope, active</text>
  <text class="small" x="605" y="356">specificity, conflict</text>

  <rect class="box box-green" x="840" y="255" width="200" height="125"/>
  <text class="label" x="870" y="300">FTS5</text>
  <text class="small" x="870" y="332">lexical search</text>
  <text class="small" x="870" y="356">BM25 scores</text>

  <rect class="box box-green" x="1095" y="255" width="205" height="125"/>
  <text class="label" x="1125" y="300">Reranker</text>
  <text class="small" x="1125" y="332">pluggable stage</text>
  <text class="small" x="1125" y="356">rerank_score</text>

  <rect class="box box-blue" x="1345" y="255" width="155" height="125"/>
  <text class="label" x="1375" y="300">Context</text>
  <text class="small" x="1375" y="332">bounded</text>
  <text class="small" x="1375" y="356">fallible</text>

  <path class="arrow" d="M285 318 H330"/>
  <path class="arrow" d="M520 318 H575"/>
  <path class="arrow" d="M785 318 H840"/>
  <path class="arrow" d="M1040 318 H1095"/>
  <path class="arrow" d="M1300 318 H1345"/>
  <path class="thin" d="M425 430 V382"/>

  <rect class="box box-red" x="580" y="455" width="195" height="100"/>
  <text class="label" x="610" y="494">Filtered</text>
  <text class="small" x="610" y="522">not exposed to</text>
  <text class="small" x="610" y="546">ranking or model</text>
  <path class="dash" d="M675 380 V455"/>

  <rect class="trace" x="210" y="690" width="1180" height="120"/>
  <text class="label" x="245" y="735">Retrieval trace and provenance</text>
  <text class="small" x="245" y="768">Stores selected IDs, filter reasons, lexical scores, rerank scores, positions, and query ID.</text>
  <text class="small" x="245" y="795">Selected records return memory_id, rule_key, version, reason_code, and evidence_ids.</text>

  <path class="dash" d="M675 555 C675 625 370 625 370 690"/>
  <path class="dash" d="M940 380 C940 640 800 610 800 690"/>
  <path class="dash" d="M1198 380 C1198 640 1100 610 1100 690"/>
  <path class="dash" d="M1422 380 C1422 640 1225 610 1225 690"/>

  <rect class="pill" x="90" y="840" width="285" height="32"/>
  <text class="pillText" x="111" y="861">Current request stays highest priority</text>
  <rect class="pill" x="390" y="840" width="330" height="32"/>
  <text class="pillText" x="431" y="861">Deleted memory never reaches ranking</text>
  <rect class="pill" x="755" y="840" width="255" height="32"/>
  <text class="pillText" x="776" y="861">Reranking is a separate stage</text>
  <rect class="pill" x="1045" y="840" width="360" height="32"/>
  <text class="pillText" x="1066" y="861">Evidence IDs make retrieval explainable</text>
</svg>
